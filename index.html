<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Think Before You React: Gotham State Machine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Gotham Threat State Machine</h1>
        <p>Your actions change the system state. Conditional logic evaluates the response.</p>
        <div class="control-panel">
            <button id="btn-escalate">Escalate Threat (+)</button>
            <button id="btn-deescalate">De-escalate Threat (-)</button>
            <button id="btn-reset">Reset System</button>
        </div>
    </header>

    <main>
        <div class="card" id="main-card">
            <img id="state-image" src="sign.jpg" alt="State Image">
            <h2 id="status-title">Current State: Level 1 (Standby)</h2>
            <p id="status-message">Gotham is quiet. Monitoring signals from the city.</p>
            <div class="state-indicator">Threat Level: <span id="level-num">1</span> / 3</div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
